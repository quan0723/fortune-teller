<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>占卜师 Jimmy &amp; 瓜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#6c3de0;--purple2:#9b59b6;--gold:#f1c40f;--pink:#e91e8c;--dark:#0a0a1a;--card-w:68px;--card-h:100px}
html,body{height:100%;overflow-x:hidden}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--dark);color:#fff;min-height:100vh;overflow-y:auto}

/* 深空背景 */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 50%,#1a0533 0%,#0a0a1a 60%),radial-gradient(ellipse at 80% 20%,#0d1a3a 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,#1a0533 0%,transparent 50%)}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out infinite alternate}
@keyframes tw{0%{opacity:.2}100%{opacity:1}}
.meteor{position:absolute;width:2px;height:80px;background:linear-gradient(to bottom,transparent,#fff);transform:rotate(-45deg);opacity:0;animation:me 8s linear infinite;animation-delay:var(--delay)}
@keyframes me{0%{opacity:0;transform:translateY(-100px) rotate(-45deg)}10%{opacity:1}30%{opacity:0;transform:translateY(600px) rotate(-45deg)}100%{opacity:0}}
.nebula{position:absolute;border-radius:50%;filter:blur(60px);opacity:.15}

/* 玻璃卡片 */
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;margin-bottom:12px}

/* 主容器 */
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px 12px 60px;min-height:100vh}

/* 头部 */
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px}
.seers{display:flex;gap:8px;flex:1}
.seer{min-width:0;flex:1;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.seer-icon{font-size:22px;line-height:1}
.seer-n{font-size:11px;opacity:.7;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seer.jimmy{border-color:rgba(108,60,224,.5)}
.seer.gua{border-color:rgba(233,30,140,.5)}
.seer-sel{background:rgba(108,60,224,.25);border-color:var(--purple);box-shadow:0 0 12px rgba(108,60,224,.3)}

/* Tab导航 */
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:8px 4px;text-align:center;border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.tab.active{background:rgba(108,60,224,.3);border-color:var(--purple);color:#fff;box-shadow:0 0 16px rgba(108,60,224,.25)}

/* 选项组 */
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.opt{padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.7);transition:all .2s}
.opt.active{background:rgba(108,60,224,.3);border-color:var(--purple);color:#fff}

/* 按钮 */
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 4px 20px rgba(108,60,224,.4);letter-spacing:1px}
.btn:active{transform:scale(.97);box-shadow:0 2px 10px rgba(108,60,224,.3)}

/* 音效/BGM按钮 */
.snd-row{display:flex;gap:8px;margin-bottom:12px}
.snd-btn{flex:1;padding:8px;border-radius:10px;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);transition:all .2s}
.snd-btn.on{background:rgba(108,60,224,.2);border-color:var(--purple);color:#fff}

/* 塔罗区 */
.tarot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 0}
.tarot-card{cursor:pointer;aspect-ratio:2/3;border-radius:8px;position:relative;transform-style:preserve-3d;transition:transform .5s}
.tarot-card .back{position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,#2d1b69,#6c3de0);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.2);overflow:hidden}
.tarot-card .back::before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,215,0,.3);border-radius:5px}
.tarot-card .back::after{content:'✧';position:absolute;font-size:20px;color:rgba(255,215,0,.5)}
.tarot-card .front{display:none;position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,#1a1a3a,#2d1b69);border:2px solid rgba(255,215,0,.5);padding:4px;font-size:9px;text-align:center;overflow:hidden}
.tarot-card .front .tc-name{font-size:10px;font-weight:bold;color:var(--gold);margin-top:2px;line-height:1.2}
.tarot-card .front .tc-icon{font-size:18px;margin-top:2px}
.tarot-card.selected .back{background:linear-gradient(135deg,#3d1b89,#8c4df0);border-color:var(--gold);box-shadow:0 0 16px rgba(255,215,0,.4)}
.tarot-card.selected::after{content:'✓';position:absolute;top:2px;right:4px;z-index:2;font-size:12px;color:var(--gold);text-shadow:0 0 4px #000}
.tarot-card.revealed{transform:rotateY(180deg)}
.tarot-card.revealed .front{display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotateY(180deg)}
.tarot-card.revealed .back{display:none}
.tarot-card.locked{cursor:default;opacity:.5;pointer-events:none}

/* 塔罗抽牌区 */
.tarot-deck-area{min-height:120px;position:relative}
.tarot-hint{text-align:center;font-size:12px;opacity:.6;padding:20px 0}

/* 塔罗结果 */
.tarot-result{margin-top:12px}
.t-result-card{background:rgba(108,60,224,.15);border:1px solid rgba(108,60,224,.3);border-radius:12px;padding:12px;margin-bottom:8px;text-align:center}
.t-result-card .pos-label{font-size:11px;opacity:.6;margin-bottom:4px}
.t-result-card .card-name{font-size:16px;font-weight:bold;color:var(--gold)}
.t-result-card .card-en{font-size:11px;opacity:.6;margin-top:2px}
.t-result-card .card-icon{font-size:28px;margin:4px 0}
.t-result-card .card-up{color:#7dffb3;font-size:12px;margin-top:6px}
.t-result-card .card-rev{color:#ffb3d9;font-size:12px;margin-top:2px}
.t-result-card .card-rev-hint{font-size:10px;opacity:.5;margin-top:2px}

/* ====== 塔罗联合解读 ====== */
.t-combined{background:linear-gradient(135deg,rgba(108,60,224,.18),rgba(233,30,140,.10));border:1px solid rgba(196,164,255,.25);border-radius:16px;padding:18px 16px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(108,60,224,.15)}
.t-combined::before{content:'✧';position:absolute;top:-30px;right:-10px;font-size:160px;opacity:.04;pointer-events:none;font-family:serif}
.t-combined-header{text-align:center;font-size:13px;letter-spacing:4px;color:var(--gold);margin-bottom:10px;opacity:.85}
.t-combined-image{text-align:center;font-size:14px;color:rgba(255,255,255,.95);line-height:1.7;margin-bottom:14px;padding:8px 6px;font-style:italic;letter-spacing:.5px;border-bottom:1px dashed rgba(255,255,255,.15);border-top:1px dashed rgba(255,255,255,.15)}
.t-combined-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.t-meta-chip{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85)}
.t-meta-energy{background:rgba(233,30,140,.15);border-color:rgba(233,30,140,.4);color:#ffc4e1}
.t-combined-section{margin-bottom:12px;padding:6px 0}
.t-combined-section:last-child{margin-bottom:0}
.t-section-title{font-size:12px;color:var(--gold);margin-bottom:6px;letter-spacing:1px;opacity:.9}
.t-section-body{font-size:13px;line-height:1.75;color:rgba(255,255,255,.92)}
.t-arc{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;line-height:1.6}
.t-arc-pos{flex-shrink:0;font-size:11px;background:rgba(108,60,224,.25);border:1px solid rgba(108,60,224,.4);color:#c4a4ff;padding:2px 8px;border-radius:6px;text-align:center;min-width:36px;margin-top:1px}
.t-arc-text{flex:1;color:rgba(255,255,255,.92)}
.t-arc-arrow{text-align:center;color:var(--gold);opacity:.4;font-size:14px;line-height:1;margin:0 0 0 18px;letter-spacing:2px}

/* ====== 塔罗领域选择器 ====== */
.domain-chip{padding:5px 10px;font-size:12px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);transition:all .2s}
.domain-chip.domain-active{background:rgba(108,60,224,.3);border-color:var(--purple);color:#fff;box-shadow:0 0 10px rgba(108,60,224,.2)}
.domain-chip:hover:not(.domain-active){background:rgba(255,255,255,.1)}

/* 塔罗领域徽章（解读页顶部） */
.t-domain-badge{text-align:center;font-size:12px;color:var(--gold);margin-bottom:10px;letter-spacing:2px}
.t-combined-badge{text-align:center;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.5);margin-bottom:4px}

/* 星宫结果 */
.horo-result .h-match{background:linear-gradient(135deg,rgba(108,60,224,.2),rgba(233,30,140,.2));border:1px solid rgba(108,60,224,.4);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
.h-match-score{font-size:36px;font-weight:bold;background:linear-gradient(135deg,#f1c40f,#e91e8c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.h-match-stars{font-size:14px;letter-spacing:3px;color:var(--gold);margin:4px 0}
.h-match-tag{font-size:12px;opacity:.7;margin-top:4px}
.horo-result .h-reading{background:rgba(255,255,255,.05);border-radius:12px;padding:12px}
.h-reading h4{font-size:13px;color:var(--gold);margin-bottom:8px}
.h-reading .dim{font-size:12px;line-height:1.7;opacity:.85}
.h-reading .dim strong{color:#fff}

/* 灵签区 */
.stick-area{min-height:100px;position:relative;display:flex;align-items:center;justify-content:center}
.stick-msg{font-size:13px;opacity:.6;text-align:center;padding:20px}
.stick-btn{display:block;width:100%;padding:13px;border-radius:14px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,var(--pink),var(--purple2));color:#fff;box-shadow:0 4px 20px rgba(233,30,140,.3);letter-spacing:1px}
.stick-btn:active{transform:scale(.97)}

/* 灵签结果 */
.sign-result{text-align:center;padding:16px 8px}
.sign-scroll{background:rgba(108,60,224,.15);border:1px solid rgba(108,60,224,.4);border-radius:14px;padding:16px;position:relative;max-width:300px;margin:0 auto}
.sign-scroll::before,.sign-scroll::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:80%;height:3px;background:linear-gradient(90deg,transparent,rgba(241,196,15,.4),transparent);border-radius:2px}
.sign-scroll::before{top:6px}
.sign-scroll::after{bottom:6px}
.sign-q{font-size:12px;opacity:.6;margin-bottom:8px}
.sign-name{font-size:20px;font-weight:bold;color:var(--gold);margin:8px 0}
.sign-gong{font-size:13px;opacity:.8;margin-bottom:8px}
.sign-poem{font-size:13px;line-height:1.8;font-style:italic;opacity:.9;padding:0 8px;margin:10px 0;border-left:2px solid rgba(241,196,15,.4);padding-left:10px;text-align:left}
.sign-interpret{font-size:12px;line-height:1.7;opacity:.8;margin-top:10px;text-align:left}
.sign-level{font-size:11px;opacity:.5;margin-top:8px}

/* 底部 */
footer{text-align:center;padding:16px 0 24px;opacity:.5;font-size:11px;line-height:1.8}
footer .sep{opacity:.4}
.fav{font-size:18px;margin-bottom:4px}

/* 选中计数 */
.sel-count{text-align:center;font-size:12px;opacity:.6;margin-bottom:8px}

/* 单人/双人切换 */
.mode-row{display:flex;gap:6px;margin-bottom:12px}
.mode-btn{flex:1;padding:8px;border-radius:10px;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);transition:all .2s;text-align:center}
.mode-btn.active{background:rgba(108,60,224,.3);border-color:var(--purple);color:#fff}

/* 落签提示 */
.drop-hint{font-size:12px;opacity:.6;text-align:center;padding:12px 0}

/* 落签动画 */
.shake-anim{animation:shake 0.5s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-5deg)}50%{transform:translateX(8px) rotate(5deg)}75%{transform:translateX(-5px) rotate(-3deg)}}

/* 抽卡动画 */
@keyframes dealIn{from{opacity:0;transform:scale(.5) translateY(-20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.tarot-card{animation:dealIn .4s ease-out}
.tarot-card:nth-child(2){animation-delay:.03s}
.tarot-card:nth-child(3){animation-delay:.06s}
.tarot-card:nth-child(4){animation-delay:.09s}
.tarot-card:nth-child(5){animation-delay:.12s}
.tarot-card:nth-child(n+6){animation-delay:.15s}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="wrap">
  <header>
    <div class="seers">
      <div class="seer jimmy" id="seer-jimmy" onclick="setSeer('jimmy')">
        <div class="seer-icon">🎴</div>
        <div class="seer-n">Jimmy</div>
        <div style="font-size:10px;opacity:.5">塔罗</div>
      </div>
      <div class="seer gua" id="seer-gua" onclick="setSeer('gua')">
        <div class="seer-icon">🔮</div>
        <div class="seer-n">瓜</div>
        <div style="font-size:10px;opacity:.5">星宫·灵签</div>
      </div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-tarot" onclick="switchTab('tarot')">🎴 塔罗</div>
    <div class="tab" id="tab-horo" onclick="switchTab('horo')">✨ 星宫</div>
    <div class="tab" id="tab-sign" onclick="switchTab('sign')">🎋 灵签</div>
  </div>

  <!-- ===== 塔罗 ===== -->
  <div id="panel-tarot">
    <div class="card">
      <div style="font-size:12px;opacity:.6;margin-bottom:8px">选择牌阵</div>
      <div class="opts">
        <div class="opt active" onclick="setTarotMode('self',this)">单张·直觉</div>
        <div class="opt" onclick="setTarotMode('three',this)">三张·过去/现在/未来</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:12px;opacity:.6;margin-bottom:8px">占卜领域</div>
      <div class="opts">
        <div class="opt domain-active domain-chip" onclick="setTarotDomain('general',this)">✧ 通用</div>
        <div class="opt domain-chip" onclick="setTarotDomain('love',this)">💕 爱情</div>
        <div class="opt domain-chip" onclick="setTarotDomain('wealth',this)">💰 财运</div>
        <div class="opt domain-chip" onclick="setTarotDomain('career',this)">💼 事业</div>
        <div class="opt domain-chip" onclick="setTarotDomain('study',this)">📚 学业</div>
        <div class="opt domain-chip" onclick="setTarotDomain('health',this)">🏥 健康</div>
      </div>
    </div>

    <div class="snd-row">
      <button class="snd-btn on" id="sfxBtn" onclick="toggleSfx()">🔊 音效</button>
      <button class="snd-btn" id="bgmBtn" onclick="toggleBgm()">🎵 背景音乐</button>
    </div>

    <div id="tarotShuffled" class="tarot-grid"></div>
    <div class="sel-count" id="selCount"></div>

    <div id="tarotDraw" style="display:none;margin-bottom:12px">
      <button class="btn" id="tarotRevealBtn" onclick="revealTarot()">✧ 翻开选中的牌 ✧</button>
    </div>

    <div id="tarotReading" class="tarot-result"></div>
    <div id="tarotStart" style="margin-top:8px">
      <button class="btn" onclick="startTarot()">🔀 洗牌并展示</button>
    </div>
  </div>

  <!-- ===== 星宫 ===== -->
  <div id="panel-horo" style="display:none">
    <div class="card">
      <div class="mode-row">
        <div class="mode-btn active" id="horo-mode-single" onclick="setHoroMode('single',this)">✨ 单人占星</div>
        <div class="mode-btn" id="horo-mode-duo" onclick="setHoroMode('duo',this)">🤝 双人默契</div>
      </div>
    </div>

    <div id="horo-single-panel">
      <div class="card">
        <div style="font-size:12px;opacity:.6;margin-bottom:8px">选择你的星座</div>
        <div class="opts" id="horo-signs" style="justify-content:center"></div>
      </div>
      <div class="card">
        <div style="font-size:12px;opacity:.6;margin-bottom:8px">占卜维度</div>
        <div class="opts">
          <div class="opt active" onclick="setHoroDim('day',this)">今日</div>
          <div class="opt" onclick="setHoroDim('week',this)">本周</div>
          <div class="opt" onclick="setHoroDim('month',this)">本月</div>
        </div>
      </div>
      <div id="horo-single-result"></div>
      <button class="btn" style="margin-top:8px" onclick="doHoroSingle()">🔮 查看星象</button>
    </div>

    <div id="horo-duo-panel" style="display:none">
      <div class="card">
        <div style="font-size:12px;opacity:.6;margin-bottom:8px">你的星座</div>
        <div class="opts" id="horo-you" style="justify-content:center"></div>
      </div>
      <div class="card">
        <div style="font-size:12px;opacity:.6;margin-bottom:8px">搭档的星座</div>
        <div class="opts" id="horo-friend" style="justify-content:center"></div>
      </div>
      <div id="horo-duo-result"></div>
      <button class="btn" style="margin-top:8px" onclick="doHoroDuo()">🔮 查看默契指数</button>
    </div>
  </div>

  <!-- ===== 灵签 ===== -->
  <div id="panel-sign" style="display:none">
    <div class="card">
      <div style="font-size:12px;opacity:.6;margin-bottom:8px">选择签筒</div>
      <div class="opts">
        <div class="opt active" onclick="setSignCat('wisdom',this)">📿 观音灵签</div>
        <div class="opt" onclick="setSignCat('career',this)">💼 事业签</div>
        <div class="opt" onclick="setSignCat('love',this)">💕 姻缘签</div>
        <div class="opt" onclick="setSignCat('health',this)">🏥 健康签</div>
        <div class="opt" onclick="setSignCat('wealth',this)">💰 财运签</div>
        <div class="opt" onclick="setSignCat('study',this)">📚 学业签</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:12px;opacity:.6;margin-bottom:8px">占卜维度</div>
      <div class="opts">
        <div class="opt active" onclick="setSignDim('day',this)">今日</div>
        <div class="opt" onclick="setSignDim('week',this)">本周</div>
        <div class="opt" onclick="setSignDim('month',this)">本月</div>
      </div>
    </div>

    <div id="signArea">
      <div class="stick-msg">👆 点击下方按钮开始摇签</div>
    </div>
    <div id="signResult" class="sign-result" style="display:none"></div>
    <button class="stick-btn" id="signBtn" onclick="shakeSign()">🌀 摇动签筒</button>
    <div id="signDropHint" class="drop-hint" style="display:none">请从上方签筒中点击选中一支签</div>
  </div>

  <footer>
    <div class="fav">✨</div>
    <div>占卜师 <span class="made">Jimmy</span> <span class="sep">&</span> <span class="made">瓜</span></div>
    <div>占星 · 塔罗 · 灵签 · 指引迷途</div>
    <div style="margin-top:6px;font-size:11px;opacity:.6">免责声明：娱乐占卜，结果仅供参考</div>
  </footer>
</div>

<script>
/* ====== Web Audio API 音效引擎 ====== */
let audioCtx=null,bgmGain=null,bgmOscs=[],sfxOn=true,bgmOn=false,bgmTimer=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function makeReverb(ctx,dur){const conv=ctx.createConvolver();const rate=ctx.sampleRate;const len=rate*dur;const buf=ctx.createBuffer(2,len,rate);for(let c=0;c<2;c++){const ch=buf.getChannelData(c);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);}conv.buffer=buf;return conv;}

function onTapTarotCard(el,idx,card,need){
  if(el.classList.contains('revealed')||el.classList.contains('locked'))return;
  const already=selectedTarot.find(c=>c.idx===idx);
  if(already){
    selectedTarot=selectedTarot.filter(c=>c.idx!==idx);
    el.classList.remove('selected');
    playSfx('click');
  } else {
    if(selectedTarot.length>=need){
      const oldest=selectedTarot.shift();
      const oldEl=document.querySelector(`.tarot-card[data-idx="${oldest.idx}"]`);
      if(oldEl)oldEl.classList.remove('selected');
    }
    selectedTarot.push({idx,card});
    el.classList.add('selected');
    playSfx('card');
  }
  const dim=tarotMode==='self'?'直觉':'过去 · 现在 · 未来';
  document.getElementById('selCount').textContent=`已选 ${selectedTarot.length}/${need} 张${need>1?'（'+dim+'）':''}`;
  if(selectedTarot.length===need){
    document.getElementById('tarotDraw').style.display='block';
    // 锁定其他牌
    document.querySelectorAll('.tarot-card:not(.selected)').forEach(c=>c.classList.add('locked'));
  } else {
    document.getElementById('tarotDraw').style.display='none';
    document.querySelectorAll('.tarot-card').forEach(c=>c.classList.remove('locked'));
  }
}

function revealTarot(){
  playSfx('reveal');

function genCombinedReading(cards,revs,domain){
  const D=TAROT_DOMAIN[domain]||TAROT_DOMAIN.general;
  const t0=TAROT_THEME[cards[0].n],t1=TAROT_THEME[cards[1].n],t2=TAROT_THEME[cards[2].n];
  const revN=revs.filter(Boolean).length;
  let imgKey;
  if(revN===0)imgKey='a0';else if(revN===3)imgKey='a1';
  else{const r=revs.indexOf(true);if(revs[1])imgKey='a6';else if(r===-1)imgKey='a5';else if(r===1)imgKey='a2';else if(r===0)imgKey='a3';else imgKey='a4';}
  const image=D.img[imgKey].replace('{t0}',t0.n).replace('{t1}',t1.n).replace('{t2}',t2.n);
  const energy=revN===0?'顺势上升':revN===3?'深度蜕变':revN===1?(revs[1]?'此刻的觉醒':'过渡期'):'重要转折';
  const p0=revs[0]?1:0,q0=revs[1]?1:0,q2=revs[2]?1:0;
  const pastText=D.past[p0].replace('{t}',t0.n);
  const presText=D.pres[q0].replace('{t}',t1.n);
  const futText=D.fut[q2].replace('{t}',t2.n);
  let insightIdx=0;
  if(t0.arc===t2.arc)insightIdx=0;
  else if(t0.arc==='新篇'&&t2.arc==='圆满')insightIdx=1;
  else if(t0.arc==='圆满'&&t2.arc==='新篇')insightIdx=2;
  else if(t0.arc==='行动'&&t2.arc==='内省')insightIdx=3;
  else if(t0.arc==='内省'&&t2.arc==='转化')insightIdx=4;
  else if(t0.arc==='转化'&&t2.arc==='圆满')insightIdx=5;
  else if(t0.arc==='转折'&&t2.arc==='转折')insightIdx=6;
  else insightIdx=7;
  let base=D.arc[insightIdx].replace('{a}',t0.arc).replace('{t0}',t0.n).replace('{t1}',t1.n).replace('{t2}',t2.n);
  const insight=D.ins[0]+'，'+base+'。';
  const a1=D.act[p0*2+(revs[0]?1:0)].replace('{t}',t0.n);
  const a2=D.act[2+q0*2+(revs[1]?1:0)].replace('{t}',t1.n);
  const a3=D.act[4+q2*2+(revs[2]?1:0)].replace('{t}',t2.n);
  return{image,energy,pastText,presText,futText,insight,advice:a1+'；'+a2+'；'+a3+'。',domainName:D.name,domainIcon:D.icon};
}

function getMatchScore(a,b){
  const sameEl=(a.el[0]===b.el[0])?1:0;
  const sameType=a.tp===b.tp?.8:.4;
  const diffId=Math.abs(a.id-b.id);
  const comp=diffId===6?.95:diffId===4||diffId===8?.85:.75;
  return Math.round((sameEl*.4+sameType*.2+comp*.4)*100);
}
function getMatchTag(score,a,b){
  const combos=[
    {keys:['火火','水水','风风','土土'],name:'🔥 同频共振',desc:'灵魂频率高度一致，默契不需言语',detail:'你们是天生的一对（搭档）。同元素让你们天然理解彼此的思维和感受，合作时1+1>2。'},
    {keys:['火风','风水','风土','土火'],name:'🌟 互补共舞',desc:'一动一静，一张一弛，配合天衣无缝',detail:'你们代表不同的能量，差异本身就是吸引力。在一起时，你们能覆盖彼此的盲区。'},
    {keys:['火火','水火','风火','土水'],name:'⚡ 欢喜冤家',desc:'磁场强烈碰撞，吵吵闹闹又分不开',detail:'你们之间有很强的化学反应，有时候会擦出火花。这种张力既是挑战也是动力。'},
    {keys:['土土','风土','水地','火土'],name:'🤝 稳稳陪伴',desc:'不张扬但坚定，细水长流的搭档情谊',detail:'你们不追求轰轰烈烈，而是在日常中彼此依靠。这种关系经得起时间考验。'}
  ];
  const el=a.el[0]+b.el[0];
  for(const c of combos){
    if(c.keys.some(k=>k===el||k===el.split('').reverse().join('')))return c;
  }
  return {name:'💫 未知缘分',desc:'宇宙自有安排，故事待续',detail:'每个组合都有独特的化学反应，保持开放的心态，答案会自然浮现。'};
}

  </div>
  <div style="margin-top:12px;text-align:center;font-size:12px;opacity:.6">✧ ${pick(MSGS_GUA)} ✧</div>
  <button class="stick-btn" style="margin-top:10px" onclick="resetSign()">🌀 再摇一签</button>`;
}
function resetSign(){
  signDrawn=false;
  document.getElementById('signArea').innerHTML='<div class="stick-msg">👆 点击下方按钮开始摇签</div>';
  document.getElementById('signResult').style.display='none';
  document.getElementById('signBtn').style.display='block';
  document.getElementById('signDropHint').style.display='none';
}

/* ====== 工具函数 ====== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
</script>
